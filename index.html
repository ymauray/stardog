<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarDog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif; user-select: none; }
  #game canvas { display: block; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: 3px; font-style: italic; color: #bfe3ff; text-shadow: 0 0 6px #0af; }
  .bar { height: 16px; margin-top: 4px; border: 2px solid #cfe8ff; border-radius: 3px; background: rgba(0, 20, 60, .55);
    transform: skewX(-20deg); overflow: hidden; box-shadow: 0 0 10px rgba(0, 170, 255, .5); }
  .fill { height: 100%; width: 100%; transition: width .15s; }
  #shieldWrap { position: absolute; top: 20px; left: 26px; }
  #shieldWrap .bar { width: 250px; }
  #shieldFill { background: linear-gradient(90deg, #1ad1ff, #7dffb0); }
  #shieldFill.low { background: linear-gradient(90deg, #ff2d55, #ff9a3d); animation: pulse .4s infinite alternate; }
  #lives { margin-top: 8px; font-size: 20px; font-weight: 800; text-shadow: 0 0 6px #000; }
  #scoreWrap { position: absolute; top: 18px; right: 30px; text-align: right; }
  #hits { font-size: 44px; font-weight: 900; font-style: italic; line-height: 1; color: #ffe066; text-shadow: 0 0 10px #f80, 3px 3px 0 #a40; }
  #score { font-size: 14px; letter-spacing: 2px; opacity: .85; }
  #chain { font-size: 14px; font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffe066; text-shadow: 0 0 8px #f80; min-height: 18px; }
  #bossWrap { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); text-align: center; }
  #bossWrap .bar { width: 380px; }
  #bossWrap .label { color: #ffc2d1; text-shadow: 0 0 6px #f04; }
  #bossFill { background: linear-gradient(90deg, #ff3d6e, #ffb03d); }
  #bottomRight { position: absolute; right: 30px; bottom: 24px; text-align: right; }
  #bombs { font-size: 22px; letter-spacing: 3px; margin-bottom: 4px; min-height: 28px; }
  #laser { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #7dff9a; text-shadow: 0 0 6px #0f6; margin-bottom: 8px; }
  #laser.lost { animation: laserLost 1.2s; }
  @keyframes laserLost { 0%, 40%, 80% { color: #ff4d6d; text-shadow: 0 0 10px #f03; transform: scale(1.25); } 20%, 60%, 100% { transform: scale(1); } }
  #bottomRight .bar { width: 190px; margin-left: auto; }
  #boostFill { background: linear-gradient(90deg, #ff8a00, #ffe066); }
  #boostFill.lock { background: #884; }
  #comm { position: absolute; left: 26px; bottom: 24px; display: flex; gap: 14px; align-items: center; max-width: 560px;
    padding: 10px 18px 10px 10px; background: rgba(0, 10, 40, .78); border: 2px solid #6cf; border-radius: 6px;
    box-shadow: 0 0 18px rgba(0, 150, 255, .45); }
  #commFace { flex: none; width: 66px; height: 66px; font-size: 48px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(#2a4a7a, #011); border: 2px solid #6cf; border-radius: 4px; }
  #commFace.talk { animation: talk .12s infinite alternate; }
  #commName { font-size: 13px; font-weight: 900; letter-spacing: 2px; }
  #commText { font-size: 17px; line-height: 1.3; margin-top: 4px; min-height: 22px; }
  #toast { position: absolute; top: 36%; width: 100%; text-align: center; font-size: 40px; font-weight: 900; font-style: italic;
    letter-spacing: 4px; text-shadow: 0 0 14px #0cf, 3px 3px 0 #036; opacity: 0; transition: opacity .3s; }
  #toast.big { font-size: 60px; }
  #countdown { position: absolute; top: 26%; width: 100%; text-align: center; font-size: 140px; font-weight: 900; font-style: italic;
    color: #ffe066; text-shadow: 0 0 24px #f80, 5px 5px 0 #a40; opacity: 0; }
  #countdown.pop { animation: countPop .95s ease-out forwards; }
  @keyframes countPop { 0% { opacity: 0; transform: scale(2.2); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(.85); } }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #pause { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 20, .5);
    font-size: 60px; font-weight: 900; font-style: italic; letter-spacing: 8px; text-shadow: 0 0 20px #0af; }

  /* ---------- Screens ---------- */
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; cursor: pointer; background: radial-gradient(rgba(0, 0, 30, .1), rgba(0, 0, 25, .75)); }
  .logo { font-size: min(15vw, 150px); font-weight: 900; font-style: italic; letter-spacing: 6px; line-height: .95;
    background: linear-gradient(180deg, #fff 0%, #a8ecff 45%, #1a6dff 55%, #ffcc33 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(5px 6px 0 #0a1840) drop-shadow(0 0 24px rgba(0, 150, 255, .6)); }
  .sub { font-size: 16px; font-weight: 800; letter-spacing: 5px; color: #ffe9b0; text-shadow: 0 0 8px #f80; }
  .big { font-size: min(10vw, 84px); font-weight: 900; font-style: italic; letter-spacing: 6px; text-shadow: 0 0 20px #0af, 4px 4px 0 #036; }
  .big.red { color: #ff4d6d; text-shadow: 0 0 20px #f03, 4px 4px 0 #400; }
  .stats { font-size: 20px; letter-spacing: 3px; line-height: 1.7; }
  .stats b { color: #ffe066; }
  .rank { font-size: 30px; font-weight: 900; letter-spacing: 4px; }
  .rank span { font-size: 70px; color: #ffe066; text-shadow: 0 0 18px #f80; vertical-align: middle; margin-left: 10px; }
  .start { font-size: 20px; font-weight: 900; letter-spacing: 4px; margin-top: 8px; }
  .blink { animation: blink 1s steps(2) infinite; }
  .missions { display: flex; gap: 14px; font-size: 14px; font-weight: 800; letter-spacing: 2px; }
  .missions span { padding: 6px 12px; border: 1px solid #6cf; border-radius: 4px; background: rgba(0, 20, 60, .6); }
  .missions span.locked { opacity: .35; border-color: #567; }
  .controls { display: grid; grid-template-columns: auto auto; gap: 6px 34px; margin-top: 6px; padding: 14px 26px;
    background: rgba(0, 10, 40, .6); border: 1px solid #4af; border-radius: 6px; font-size: 14px; text-align: left; }
  .controls b { color: #9fe6ff; letter-spacing: 1px; }
  .foot { font-size: 12px; opacity: .65; letter-spacing: 2px; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { to { opacity: .55; } }
  @keyframes talk { to { transform: translateY(-3px) scale(1.05); } }
</style>
</head>

<script type="module">
import * as THREE from 'three';
const { Vector3, Group, Mesh } = THREE;

// ======================================================================
// Config
// ======================================================================
const BOUND_X = 38, BOUND_Y_MIN = 3, BOUND_Y_MAX = 36;
const MAX_V = 44;
const SPEED_BASE = 70, SPEED_BOOST = 135, SPEED_BRAKE = 32;
const BOOST_DRAIN = 0.5, BOOST_REGEN = 0.12; // per second, on a 0..1 gauge
const SHELL_HP = 3, SHELL_WARNING = 0.8; // Tabby Tank shells: laser hits to destroy, seconds of muzzle glow before firing
const YARN_POP = 0.7, YARN_SPEED = 80; // yarn balls: seconds popping up before they lock a line onto you, then their speed
const BOSS_COUNTDOWN = 5; // seconds between the boss settling in and the fight starting
const LASER_LOSS_GRACE = 5; // seconds after losing a laser level during which another can't be lost
const ROLL_DUR = 0.55, CHARGE_TIME = 2.0, FIRE_INTERVAL = 0.13; // CHARGE_TIME: seconds of holding fire for a lock-on shot
const LASER_SPEED = 480;
// Aim assist: a shot snaps to an enemy when the reticle line passes within ~4° of its hull
const ASSIST_ANGLE = 0.07, ASSIST_RANGE = 200;
// Charged-shot lock-on cone (~8°), and how fast guided shots can turn (rad/s) so sharp dodges can escape them
const LOCK_ANGLE = 0.14, LASER_TURN = 1.5, HOMING_TURN = 2.5;
const PLAYER_R = 1.7;
const MUSIC_VOL = 0.32;
const URL_PARAMS = new URLSearchParams(location.search);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = THREE.MathUtils.clamp;
const damp = (a, b, k, dt) => a + (b - a) * Math.min(1, k * dt);
const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
const _v1 = new Vector3(), _v2 = new Vector3(), _ra = new Vector3(), _rb = new Vector3();
const ORIGIN = new Vector3(), UP = new Vector3(0, 1, 0);
const DIALOG = JSON.parse(document.getElementById('dialog').textContent);

// ======================================================================
// Renderer / scene / camera
// ======================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf4b089, 160, 780);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.5, 3000);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x35553f, 1.4);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xffe0c0, 2.4);
sunLight.position.set(-20, 50, 30);
scene.add(sunLight);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.55, metalness: 0.15, ...o });
const glow = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });

// Sky dome: gradient that meets the fog colour at the horizon (mirrored below it in space)
const skyUniforms = {
  top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bottom: { value: new THREE.Color() },
  sunDir: { value: new Vector3(0, 0, -1) }, mirror: { value: 0 },
};
const sky = new Mesh(new THREE.SphereGeometry(2200, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyUniforms,
  vertexShader: `varying vec3 vDir;
    void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; uniform vec3 sunDir; uniform float mirror; varying vec3 vDir;
    void main() {
      float h = mirror > 0.5 ? abs(vDir.y) : vDir.y;
      vec3 col = mix(bottom, mid, smoothstep(0.0, 0.22, h));
      col = mix(col, top, smoothstep(0.22, 0.75, h));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0, 0.85, 0.6) * pow(s, 400.0) * 2.0 + vec3(1.0, 0.6, 0.3) * pow(s, 10.0) * 0.35;
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -1;
scene.add(sky);

// Stars (space only) ride along with the sky dome
const stars = (() => {
  const n = 1800, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    _v1.randomDirection().multiplyScalar(1900);
    arr.set([_v1.x, _v1.y, _v1.z], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false }));
})();
sky.add(stars);

// Backdrops that follow the player: mountains (planets) or a ringed planet (space)
const backdrop = new Group();
scene.add(backdrop);
const mtnMats = [new THREE.MeshBasicMaterial({ color: 0xc6909c, fog: false }), new THREE.MeshBasicMaterial({ color: 0xa97a92, fog: false })];
const mountains = new Group();
backdrop.add(mountains);
for (let i = 0; i < 46; i++) {
  const a = rand(-1.5, 1.5), R = rand(1400, 1700), h = rand(70, 230);
  const m = new Mesh(new THREE.ConeGeometry(rand(110, 260), h, 5), pick(mtnMats));
  m.position.set(Math.sin(a) * R, h / 2 - 5, -Math.cos(a) * R);
  m.rotation.y = rand(0, Math.PI);
  mountains.add(m);
}
const planet = new Group();
backdrop.add(planet);
{
  const ball = new Mesh(new THREE.SphereGeometry(260, 40, 24), new THREE.MeshLambertMaterial({ color: 0xd9824a, fog: false }));
  planet.add(ball);
  const ring = new Mesh(new THREE.RingGeometry(330, 480, 64),
    new THREE.MeshBasicMaterial({ color: 0xe8c48a, transparent: true, opacity: 0.5, side: THREE.DoubleSide, fog: false }));
  ring.rotation.x = 1.25;
  ring.rotation.y = 0.3;
  planet.add(ring);
  planet.position.set(-700, 280, -1550);
}

// Ground: a big plane that travels with the player; texture offset keeps it world-locked
const G_SIZE = 3000, G_TILE = 60;
const groundCanvas = document.createElement('canvas'), groundEmiCanvas = document.createElement('canvas');
groundCanvas.width = groundCanvas.height = groundEmiCanvas.width = groundEmiCanvas.height = 256;
const groundTex = new THREE.CanvasTexture(groundCanvas), groundEmi = new THREE.CanvasTexture(groundEmiCanvas);
for (const t of [groundTex, groundEmi]) {
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(G_SIZE / G_TILE, G_SIZE / G_TILE);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
}
function drawGround([base, alt, line]) {
  const g = groundCanvas.getContext('2d'), e = groundEmiCanvas.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  g.fillStyle = alt; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
  e.fillStyle = '#000'; e.fillRect(0, 0, 256, 256);
  for (const c of [g, e]) { c.strokeStyle = line; c.lineWidth = 4; c.strokeRect(0, 0, 256, 256); }
  groundTex.needsUpdate = groundEmi.needsUpdate = true;
}
const ground = new Mesh(new THREE.PlaneGeometry(G_SIZE, G_SIZE),
  new THREE.MeshStandardMaterial({ map: groundTex, emissive: 0xffffff, emissiveMap: groundEmi, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Streaking dust / embers for a sense of speed
const DUST_N = 400;
const dustArr = new Float32Array(DUST_N * 3);
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustArr, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xaabbff, size: 0.7, transparent: true, opacity: 0.8, depthWrite: false });
const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled = false;
scene.add(dust);

// ======================================================================
// Shared geometry / materials
// ======================================================================
const GEO = {
  sphere: new THREE.SphereGeometry(1, 16, 12),
  laser: new THREE.BoxGeometry(0.28, 0.28, 6),
  eShot: new THREE.SphereGeometry(0.75, 10, 8),
  eShotGlow: new THREE.SphereGeometry(1.4, 10, 8),
  catBody: (() => { const g = new THREE.OctahedronGeometry(1.8, 0); g.scale(1, 0.65, 1.7); return g; })(),
  catEar: new THREE.ConeGeometry(0.55, 1.3, 4),
  catWing: new THREE.BoxGeometry(6.4, 0.18, 1.5),
  catFin: new THREE.BoxGeometry(0.18, 1.3, 1.2),
  catEye: new THREE.SphereGeometry(0.3, 8, 6),
  turretBase: new THREE.CylinderGeometry(2.4, 3.0, 2.2, 8),
  turretDome: new THREE.SphereGeometry(1.9, 10, 8),

const keys = {};
const pending = { bomb: false, roll: 0 };
addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  switch (e.code) {
    case 'Enter': case 'NumpadEnter': confirmScreen(); break;
    case 'Digit1': case 'Digit2': case 'Digit3': {
      const n = Number(e.code.slice(-1));
      if (canStart && screenKind === 'title' && n <= unlocked) startRun(n - 1);
      break;
    }
    case 'KeyB': case 'KeyK': pending.bomb = true; break;
    case 'KeyQ': pending.roll = -1; break;
    case 'KeyE': pending.roll = 1; break;
    case 'KeyP': if (state === 'playing') togglePause(); break;
    case 'Escape':
      if (state === 'playing') togglePause();
      else if (canStart && screenKind === 'gameover') toTitle();
      break;
    case 'KeyM': toggleMute(); break;
    case 'KeyT': toggleAimAssist(); break;
    case 'KeyV': toggleVoice(); break;
    case 'KeyI': invertY = !invertY; toast(invertY ? 'Y-AXIS INVERTED' : 'Y-AXIS NORMAL', 1.2); break;
  }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'playing' && !paused) togglePause();
});

const pad = { x: 0, y: 0, fire: false, boost: false, brake: false, prev: [] };
function pollGamepad() {
  pad.x = pad.y = 0; pad.fire = pad.boost = pad.brake = false;
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const g of list) if (g) { gp = g; break; }
  if (!gp) return;
  const dz = (v) => (Math.abs(v) < 0.18 ? 0 : v);
  const btn = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const edge = (i) => btn(i) && !pad.prev[i];
  pad.x = dz(gp.axes[0] || 0) + (btn(15) ? 1 : 0) - (btn(14) ? 1 : 0);
  pad.y = -dz(gp.axes[1] || 0) + (btn(12) ? 1 : 0) - (btn(13) ? 1 : 0);
  pad.fire = btn(0); pad.boost = btn(7); pad.brake = btn(6);
  if (edge(1) || edge(2)) pending.bomb = true;
  if (edge(3)) toggleAimAssist();
  if (edge(4)) pending.roll = -1;
  if (edge(5)) pending.roll = 1;
  if (edge(9)) { if (state === 'playing') togglePause(); else confirmScreen(); }
  if (edge(0)) confirmScreen();
  pad.prev = gp.buttons.map((b) => b.pressed);
}

function readInput() {
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y += 1;
  if (keys.ArrowDown || keys.KeyS) y -= 1;
  return {
    x: clamp(x + pad.x, -1, 1), y: clamp(y + pad.y, -1, 1),
    fire: !!(keys.Space || keys.KeyJ || pad.fire),
    boost: !!(keys.ShiftLeft || keys.ShiftRight || pad.boost),
    brake: !!(keys.KeyC || keys.KeyZ || pad.brake),
  };
}

let AC = null, master, sfxBus, musBus, voiceIn, noiseBuf, muted = false, lastTink = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.55;
  master.connect(AC.destination);
  const comp = AC.createDynamicsCompressor();
  comp.connect(master);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(comp);
  musBus = AC.createGain(); musBus.gain.value = MUSIC_VOL; musBus.connect(comp);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // Radio chain: band-limit (high-pass + low-pass), a touch of saturation, then boost
  voiceIn = AC.createGain();
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520; hp.Q.value = 0.9;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3100; lp.Q.value = 0.9;
  const mid = AC.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1700; mid.gain.value = 5; mid.Q.value = 1;
  const shaper = AC.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) { const x = (i / 511.5) - 1; curve[i] = Math.tanh(x * 3.5) / Math.tanh(3.5); }
  shaper.curve = curve;
  const vOut = AC.createGain(); vOut.gain.value = 1.1;
  voiceIn.connect(hp).connect(lp).connect(mid).connect(shaper).connect(vOut).connect(comp);

  setInterval(musicTick, 25);
  loadVoices();
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.55;
  if (muted && window.speechSynthesis) speechSynthesis.cancel();
  toast(muted ? 'SOUND OFF' : 'SOUND ON', 1);
}
function tone(type, f0, f1, dur, vol, at, bus) {
  at = at ?? AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, at);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(bus || sfxBus);
  o.start(at);
  o.stop(at + dur + 0.05);
}
function noise(dur, vol, f0, f1, at, ftype = 'lowpass', q = 1, bus) {
  at = at ?? AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, at);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, at);

const voiceBufs = {};
let voicesRequested = false, curVoice = null;
function loadVoices() {
  if (voicesRequested || !AC || location.protocol === 'file:') return;
  voicesRequested = true;
  for (const id of Object.keys(DIALOG)) {
    fetch(`voices/${id}.m4a`)
      .then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(r.status)))
      .then((b) => AC.decodeAudioData(b))

}

function stopVoice() {
  if (!curVoice) return;

  if (curVoice.bed) { try { curVoice.bed.stop(); } catch {} }

}
// Plays a radio line; returns its duration in seconds (0 when silent)
function startVoice(id, who) {
  stopVoice();
  if (!voiceOn || !AC || muted) return 0;
  const cast = CAST[who], t = AC.currentTime;
  sfx.squelch(t, true);
  const buf = voiceBufs[id];

    const src = AC.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = cast.rate;
    src.connect(voiceIn);
    const start = t + 0.1, dur = buf.duration / cast.rate;
    src.start(start);
    // faint hiss under the voice
    const bed = AC.createBufferSource();
    bed.buffer = noiseBuf; bed.loop = true;
    const bf = AC.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 3000; bf.Q.value = 0.6;
    const bg = AC.createGain(); bg.gain.value = 0.035;
    bed.connect(bf).connect(bg).connect(sfxBus);
    bed.start(t, Math.random());
    bed.stop(start + dur + 0.05);
    sfx.squelch(start + dur, false);
    const v = { src, bed };
    src.onended = () => { if (curVoice === v) { curVoice = null; duck(false); } };
    curVoice = v;
    duck(true);
    return dur + 0.15;
  }
  // Fallback when voice files are missing (e.g. opened via file://): browser speech, unfiltered
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(DIALOG[id][1]);
    u.lang = 'en-US'; u.pitch = cast.pitch; u.rate = 1.05;
    const v = { speech: true };
    u.onend = () => { if (curVoice === v) { curVoice = null; duck(false); } };
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    curVoice = v;
    duck(true);

  }

}

function particles(pos, { n = 30, speed = 30, size = 1.5, color = 0xffaa33, life = 0.8, drag = 2, bz = 0 } = {}) {
  const arr = new Float32Array(n * 3), vel = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    _v1.randomDirection().multiplyScalar(speed * rand(0.3, 1));
    arr[i * 3] = pos.x; arr[i * 3 + 1] = pos.y; arr[i * 3 + 2] = pos.z;
    vel[i * 3] = _v1.x; vel[i * 3 + 1] = _v1.y; vel[i * 3 + 2] = _v1.z;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));

  scene.add(pts);
  let t = 0;
  effects.push({
    update(dt) {
      t += dt;
      const k = Math.exp(-drag * dt);
      for (let i = 0; i < n * 3; i++) { arr[i] += vel[i] * dt; vel[i] *= k; }
      if (bz) for (let i = 2; i < n * 3; i += 3) arr[i] += bz * dt;
      geo.attributes.position.needsUpdate = true;
      mat.opacity = Math.max(0, 1 - t / life);

}

  const mat = glow(color, 1);

  m.position.copy(pos);
  scene.add(m);
  let t = 0;
  effects.push({
    update(dt) {
      t += dt;
      const k = t / life;
      m.scale.setScalar(radius * (0.3 + 0.7 * Math.sqrt(k)));
      m.position.z += bz * dt;

      return true;
    },

}

// --- Cat fighter: flies at you along a path
function spawnFighter(o) {

  const e = {
    type: 'fighter', mesh, pos: mesh.position, radius: 3, hp: HP.fighter, points: 1, t: 0,
    bx: o.x, by: o.y, path: o.path || 'straight', phase: o.phase || 0, dir: o.dir || 1, vz: o.vz ?? 28,
    fireAt: -rand(110, 260), fired: Math.random() > fireChance(), collideDmg: 15, drop: o.drop || null, update: updateFighter,
  };

}
function updateFighter(e, dt) {
  e.t += dt;
  const p = e.pos, ox = p.x;
  p.z += e.vz * dt;
  let x = e.bx, y = e.by;
  if (e.path === 'sine') { x = e.bx + Math.sin(e.t * 2 + e.phase) * 13; y = e.by + Math.cos(e.t * 1.6 + e.phase) * 4; }
  else if (e.path === 'cross') { x = -e.dir * 55 + e.dir * e.t * 26 + e.bx; y = e.by + Math.sin(e.t * 3 + e.phase) * 3; }
  else if (e.path === 'spiral') { const a = e.t * 2.2 + e.phase; x = e.bx + Math.cos(a) * 14; y = e.by + Math.sin(a) * 8.5; }

  if (!e.fired && rel > e.fireAt) { e.fired = true; fireAt(p, 85); }
  if (rel > 30) e.dead = e.gone = true;
}

      } else if (e.type === 'heavy' && hurt) {

  }

        spawnFighter({ x: b.root.position.x - 15, y: b.root.position.y, dist: b.dist - 10, path: 'sine' });
        spawnFighter({ x: b.root.position.x + 15, y: b.root.position.y, dist: b.dist - 10, path: 'sine', phase: Math.PI });
      }
    }
    if (b.phase === 3) {
      b.jawT += dt;
      const open = b.jawT % 6 > 2.5;
      if (open && !b.wasOpen) {
        for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2; fireAt(b.coreE.pos, 80, Math.cos(a) * 14, Math.sin(a) * 10); }
        sfx.roar();
      }
      b.wasOpen = open;
      if (open && b.attackT <= 0) { fireAt(b.coreE.pos, 100); b.attackT = 0.6; }
      b.spawnT -= dt;
      if (b.spawnT <= 0) { b.spawnT = 11; spawnSwooper(0); spawnSwooper(1); }
    }
  }
  const jawTarget = b.phase === 3 && b.jawT % 6 > 2.5 ? 1.35 : 0;
  b.jawAngle = damp(b.jawAngle, jawTarget, 6, dt);
  b.jaw.rotation.x = b.jawAngle;
  b.coreE.invuln = !(b.phase === 3 && b.jawAngle > 0.9);
  b.core.scale.setScalar(1 + Math.sin(b.t * 10) * 0.08);
}

// ======================================================================
// Pickups
// ======================================================================
function spawnPickup(type, x, y, z, approach = 0) {
  const ring = type === 'silver' || type === 'gold';
  const mesh = new Mesh(ring ? GEO.ring : GEO.crate, PICKUP_MATS[type]);
  mesh.position.set(x, Math.max(4, y), z);
  scene.add(mesh);
  pickups.push({ type, ring, mesh, approach, rel: z - P.z });
}
function collect(p) {
  switch (p.type) {
    case 'silver': P.shield = Math.min(100, P.shield + 30); toast('SHIELD +30', 1); break;
    case 'gold':
      P.shield = Math.min(100, P.shield + 50);
      P.gold++;
      P.score += 1000;
      if (P.gold % 3 === 0) { P.lives++; toast('1-UP!', 1.5); sfx.woof(); }
      else toast(`GOLD RING ${P.gold % 3}/3`, 1.2);
      break;
    case 'laser':
      if (P.laser < 2) {
        P.laser++;
        toast(P.laser === 1 ? 'TWIN LASERS!' : 'HYPER LASERS!', 1.5);
        comm(P.laser === 1 ? 'twin' : 'hyper');
      } else { P.score += 1000; toast('+1000', 1); }
      break;
    case 'bomb': P.bombs = Math.min(9, P.bombs + 1); toast('BOMB +1', 1); break;
  }
  sfx.pickup();
  particles(p.mesh.position, { n: 25, speed: 20, size: 1.2, color: p.type === 'gold' ? 0xffdd55 : 0xddeeff, life: 0.5 });
}
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i], m = p.mesh;
    if (p.approach) { p.rel += p.approach * dt; m.position.z = P.z + p.rel; }
    if (p.ring) m.rotation.y = Math.sin(time * 2 + i) * 0.5;
    else { m.rotation.x += dt * 1.5; m.rotation.y += dt * 2; }
    if (P.alive && state === 'playing' && m.position.distanceTo(playerPos) < (p.ring ? 4 : 3.6)) {
      collect(p);
      scene.remove(m);
      pickups.splice(i, 1);
    } else if (m.position.z > P.z + 30) {
      scene.remove(m);
      pickups.splice(i, 1);
    }
  }
}

let nextDecoZ = 0, nextLaneZ = 0;
function addBox(mat, x, z, w, h, d, lane, y0 = 0) {
  const m = new Mesh(GEO.unitBox, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y0, z);
  scene.add(m);
  const o = { mesh: m, lane, minX: x - w / 2, maxX: x + w / 2, minY: y0, maxY: y0 + h, minZ: z - d / 2, maxZ: z + d / 2 };
  scenery.push(o);
  return o;
}
function addDeco(geo, mat, x, y, z, sx, sy = sx, sz = sx) {
  const m = new Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  scene.add(m);
  scenery.push({ mesh: m, lane: false, maxZ: z + Math.max(sx, sz) });
  return m;
}
function spawnDeco(z) {
  for (const s of [-1, 1]) {
    const r = Math.random();
    if (env.deco === 'city') {
      if (r < 0.55) {
        const w = rand(10, 24), d = rand(10, 24);
        addBox(pick(CITY_MATS), s * (46 + w / 2 + rand(0, 220)), z + rand(-8, 8), w, rand(12, 60), d, false);
      } else if (r < 0.9) {
        const x = s * rand(48, 260);
        for (let k = 0; k < 3; k++) addDeco(GEO.tree, M.tree, x + rand(-8, 8), 0, z + rand(-8, 8), rand(0.7, 1.4));
      }
    } else if (env.deco === 'space') {
      if (r < 0.45) {
        const sc = rand(6, 40);
        const m = addDeco(pick(GEO.rocks), M.rockDeco, s * rand(60 + sc, 320), rand(-120, 160), z + rand(-10, 10), sc, sc * rand(0.6, 1), sc);
        m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
      }
    } else if (env.deco === 'spires') {
      if (r < 0.4) {
        const w = rand(10, 20), d = rand(10, 20);
        addBox(pick(FORT_MATS), s * (46 + w / 2 + rand(0, 220)), z + rand(-8, 8), w, rand(20, 80), d, false);
      } else if (r < 0.8) {
        const x = s * rand(50, 260), h = rand(20, 60), rr = rand(3, 7);
        addDeco(GEO.spire, M.spire, x, 0, z, rr, h, rr);
        addDeco(GEO.spire, M.spireTip, x, h * 0.82, z, rr * 0.2, h * 0.18, rr * 0.2);
      } else {
        const m = addDeco(GEO.crystal, M.crystal, s * rand(50, 260), rand(2, 6), z, rand(2, 5), rand(5, 12), rand(2, 5));
        m.rotation.y = rand(0, 3);
      }
    }
  }
}
function spawnLane(z) {
  const fort = env.deco === 'spires';
  if (obstacleMode === 'city') {
    if (Math.random() < 0.55) addBox(pick(fort ? FORT_MATS : CITY_MATS), rand(-32, 32), z, rand(8, 14), rand(10, 28), rand(8, 14), true);
  } else if (obstacleMode === 'pillars') {
    const mat = fort ? M.spire : M.stone;
    addBox(mat, rand(-34, 34), z, 5, 70, 5, true);
    if (Math.random() < 0.4) addBox(mat, rand(-34, 34), z - 12, 5, 70, 5, true);
  } else if (obstacleMode === 'asteroids' || obstacleMode === 'asteroids+') {
    const n = obstacleMode === 'asteroids+' ? 2 + (Math.random() < 0.5 ? 1 : 0) : 1 + (Math.random() < 0.5 ? 1 : 0);
    for (let k = 0; k < n; k++) spawnRock(rand(-36, 36), rand(4, 34), z - rand(0, 20), rand(2.5, 6));
  }
}
function spawnArch(z, cx) {
  const mat = env.deco === 'spires' ? M.spire : M.stone;
  addBox(mat, cx - 17, z, 4, 32, 4, true);
  addBox(mat, cx + 17, z, 4, 32, 4, true);
  addBox(mat, cx, z, 38, 4, 4, true, 28);
  arches.push({ z, cx, done: false });
}
function updateScenery() {
  while (nextDecoZ > P.z - 900) { spawnDeco(nextDecoZ); nextDecoZ -= rand(18, 36); }
  if (obstacleMode !== 'none') {
    const step = obstacleMode === 'pillars' ? 38 : obstacleMode === 'asteroids+' ? 30 : 45;
    while (nextLaneZ > P.z - 480) { spawnLane(nextLaneZ); nextLaneZ -= step + rand(0, 20); }
  } else nextLaneZ = P.z - 480;

  for (let i = scenery.length - 1; i >= 0; i--) {
    if (scenery[i].maxZ > P.z + 60) { scene.remove(scenery[i].mesh); scenery.splice(i, 1); }
  }
  if (!P.alive || state !== 'playing') return;
  for (const o of scenery) {
    if (!o.lane || o.maxZ < P.z - 5 || o.minZ > P.z + 5) continue;
    const dx = P.x - clamp(P.x, o.minX, o.maxX), dy = P.y - clamp(P.y, o.minY, o.maxY), dz = P.z - clamp(P.z, o.minZ, o.maxZ);
    if (dx * dx + dy * dy + dz * dz < PLAYER_R * PLAYER_R) {
      hurtPlayer(20);
      P.vx = (P.x < (o.minX + o.maxX) / 2 ? -1 : 1) * 45;
      break;
    }
  }
  for (let i = arches.length - 1; i >= 0; i--) {
    const a = arches[i];
    if (!a.done && P.z < a.z) {
      a.done = true;
      if (Math.abs(P.x - a.cx) < 15 && P.y < 28) {
        P.hits++;
        P.score += 500;
        toast('NICE! +500', 0.9);
        sfx.pickup();
      }
    }
    if (a.done) arches.splice(i, 1);
  }
}

// ======================================================================
// Player damage / life cycle
// ======================================================================
// once a boss fight starts, hits no longer cost laser levels
const lasersLocked = () => !!(boss && boss.fighting);
function hurtPlayer(dmg) {
  if (!P.alive || P.invuln > 0 || state !== 'playing') return false;
  P.shield -= dmg;
  P.invuln = 1.1;
  shake = Math.max(shake, 0.8);
  flashScreen('radial-gradient(transparent 35%, rgba(255,0,40,.65))');
  sfx.hit();
  if (P.shield <= 0) { P.shield = 0; killPlayer(); return true; }
  if (P.laser > 0 && P.laserLossCd <= 0 && !lasersLocked()) {
    // taking damage costs one laser level, at most once every LASER_LOSS_GRACE seconds
    P.laser--;
    P.laserLossCd = LASER_LOSS_GRACE;
    toast(P.laser === 1 ? 'HYPER LASERS LOST!' : 'TWIN LASERS LOST!', 1.3);
    sfx.downgrade();
    $('laser').classList.remove('lost');
    void $('laser').offsetWidth; // restart the CSS animation
    $('laser').classList.add('lost');
    if (!commCur && !commQueue.length) comm('laserdown');
  } else if (!commCur && !commQueue.length && Math.random() < 0.35) comm(pick(['hurt1', 'hurt2', 'hurt3', 'hurt4']));
  return true;
}
function killPlayer() {
  P.alive = false;
  P.lives--;
  P.roll = null; P.charge = 0;
  explode(playerPos, 2.5);
  sfx.explode(true);
  P.respawnT = 2.5;
  clearComms();
  comm(P.lives > 0 ? 'down' : 'lost');
}
function respawn() {
  Object.assign(P, { alive: true, shield: 100, invuln: 3, laser: Math.max(0, P.laser - 1), bombs: Math.max(P.bombs, 3), x: 0, y: 16, vx: 0, vy: 0, boost: 1, boostLock: false });
}
function gameOver() {
  state = 'gameover';
  setMusic('none');
  screenKind = 'gameover';
  screenTimer = 1.2;
}

  P.hits += 10;
  for (const s of eShots) scene.remove(s.mesh);
  eShots.length = 0;
  for (const id of lv.win) comm(id);
  if (levelIdx + 1 < LEVELS.length) {
    unlocked = Math.max(unlocked, levelIdx + 2);
    localStorage.setItem('stardog.unlocked', String(unlocked));

  screenKind = levelIdx + 1 < LEVELS.length ? 'clear' : 'victory';
  screenTimer = 7.5;
}

    <div class="stats">HITS <b>${hits}</b><br>SHIELD BONUS <b>${fmt(P.levelBonus)}</b><br>SCORE <b>${fmt(P.score)}</b></div>
    <div class="rank">RANK<span>${rankFor(hits, lv.par)}</span></div>
    <div class="start blink">PRESS ENTER FOR MISSION ${levelIdx + 2}: ${next.name}</div>`;
  },
  victory: () => {
    const lv = LEVELS[levelIdx], par = LEVELS.reduce((s, l) => s + l.par, 0), hits = P.hits - levelStart.hits;
    return `
    <div class="big">MISSION COMPLETE</div>
    <div class="sub">${lv.clearText} GOOD BOY, STARDOG!</div>
    <div class="stats">MISSION HITS <b>${hits}</b> · SHIELD BONUS <b>${fmt(P.levelBonus)}</b><br>TOTAL HITS <b>${P.hits}</b><br>FINAL SCORE <b>${fmt(P.score)}</b></div>
    <div class="rank">${levelStart.fullRun ? 'CAMPAIGN RANK' : 'RANK'}<span>${levelStart.fullRun ? rankFor(P.hits, par) : rankFor(hits, lv.par)}</span></div>
    <div class="start blink">PRESS ENTER TO RETURN TO TITLE</div>`;
  },
};
function showScreen(kind) {
  screenKind = kind;
  $screen.innerHTML = SCREENS[kind]();
  $screen.classList.remove('hidden');
  $hud.classList.add('hidden');
  canStart = true;
}
$screen.addEventListener('click', () => confirmScreen());
function confirmScreen() {
  if (!canStart) return;
  if (screenKind === 'title') startRun(clamp((Number(URL_PARAMS.get('level')) || 1) - 1, 0, LEVELS.length - 1));
  else if (screenKind === 'gameover') startLevel(levelIdx, true);
  else if (screenKind === 'clear') startLevel(levelIdx + 1);
  else if (screenKind === 'victory') toTitle();
}

function clearWorld() {
  for (const e of enemies) if (e.mesh && e.mesh.parent === scene) scene.remove(e.mesh);
  enemies.length = 0;
  for (const list of [pShots, eShots, pickups]) { for (const s of list) scene.remove(s.mesh); list.length = 0; }
  if (boss) { scene.remove(boss.root); boss = null; }
  for (const o of scenery) scene.remove(o.mesh);
  scenery.length = 0;
  arches.length = 0;
  nextDecoZ = P.z + 40;
  obstacleMode = 'none';
  clearComms();
  $bossWrap.classList.add('hidden');
}
function startRun(idx) {
  resetPlayer();
  startLevel(idx, false, idx === 0);
}
function startLevel(idx, retry = false, fullRun = levelStart?.fullRun ?? false) {
  initAudio();
  levelIdx = idx;
  if (retry) Object.assign(P, { score: levelStart.score, hits: levelStart.hits, laser: levelStart.laser, bombs: levelStart.bombs, gold: levelStart.gold, lives: 3 });
  else levelStart = { score: P.score, hits: P.hits, laser: P.laser, bombs: Math.max(3, P.bombs), gold: P.gold, fullRun };
  Object.assign(P, { x: 0, y: 15, vx: 0, vy: 0, speed: SPEED_BASE, shield: 100, bombs: Math.max(3, P.bombs), invuln: 2, roll: null, laserLossCd: 0, waveChain: 0,
    charge: 0, fireHeld: false, alive: true, boost: 1, boostLock: false });
  clearWorld();
  const lv = LEVELS[idx];
  applyEnv(ENVS[lv.env]);
  // ?t=<seconds> jumps ahead in the mission (handy for practising a boss: ?t=97)
  levelT = Math.max(0, Number(URL_PARAMS.get('t')) || 0);
  scriptIdx = lv.script.findIndex(([t]) => t >= levelT);
  if (scriptIdx < 0) scriptIdx = lv.script.length;
  screenTimer = -1; rollTipShown = false;
  state = 'playing';
  canStart = false;
  screenKind = null;
  $screen.classList.add('hidden');
  $hud.classList.remove('hidden');
  setMusic(lv.music);
  toast(`MISSION ${idx + 1} · ${lv.name}`, 3, true);
  sfx.woof();
}
function toTitle() {
  clearWorld();
  resetPlayer();
  state = 'title';
  setMusic('none');
  applyEnv(ENVS.barkeria);
  showScreen('title');
}

// ======================================================================
// Update
// ======================================================================
function updatePlayer(dt) {
  const ctrl = state === 'playing' && P.alive;
  if (ctrl) {
    const inp = readInput();
    P.vx = damp(P.vx, inp.x * MAX_V, 6, dt);
    P.vy = damp(P.vy, (invertY ? -inp.y : inp.y) * MAX_V * 0.85, 6, dt);
    if (pending.roll && !P.roll) {
      P.roll = { t: 0, dir: pending.roll };
      sfx.roll();
      if (!rollTipShown) { rollTipShown = true; if (!commCur) comm('rolltip'); }
    }
    let rollPush = 0;
    if (P.roll) {
      P.roll.t += dt;
      rollPush = P.roll.dir * 22;
      if (P.roll.t >= ROLL_DUR) P.roll = null;
    }
    P.x = clamp(P.x + (P.vx + rollPush) * dt, -BOUND_X, BOUND_X);
    P.y = clamp(P.y + P.vy * dt, BOUND_Y_MIN, BOUND_Y_MAX);

    let target = SPEED_BASE;
    if ((inp.boost || inp.brake) && !P.boostLock) {
      target = inp.boost ? SPEED_BOOST : SPEED_BRAKE;
      P.boost -= dt * BOOST_DRAIN;
      if (P.boost <= 0) { P.boost = 0; P.boostLock = true; }
    } else {
      P.boost = Math.min(1, P.boost + dt * BOOST_REGEN);
      if (P.boostLock && P.boost >= 0.5) P.boostLock = false;
    }
    P.speed = damp(P.speed, target, 3, dt);

    aim.set(P.vx / MAX_V * 0.16, P.vy / MAX_V * 0.12, -1).normalize();
    assistTarget = aimAssist ? findTarget(ASSIST_ANGLE, true) : null;
    if (pending.bomb) launchBomb();
    P.fireCd -= dt;
    if (inp.fire && !P.fireHeld) { firePlayer(); P.fireCd = FIRE_INTERVAL; P.charge = 0; }
    if (inp.fire) {
      // holding fire keeps shooting automatically while the lock-on shot charges up
      if (P.fireCd <= 0) { firePlayer(); P.fireCd += FIRE_INTERVAL; }
      const before = P.charge;
      P.charge += dt;
      if (before < CHARGE_TIME && P.charge >= CHARGE_TIME) sfx.ready();
    } else if (P.fireHeld) {
      if (P.charge >= CHARGE_TIME) fireCharged();
      P.charge = 0;
    }
    P.fireHeld = inp.fire;
    lockTarget = P.charge >= CHARGE_TIME ? findTarget(LOCK_ANGLE) : null;
    if (P.invuln > 0) P.invuln -= dt;
    if (P.laserLossCd > 0) P.laserLossCd -= dt;
  } else {
    P.charge = 0; P.fireHeld = false; P.roll = null; lockTarget = null; assistTarget = null;
    if (state === 'playing') {
      // dead, waiting for respawn
      P.respawnT -= dt;
      if (P.respawnT <= 0) { if (P.lives > 0) respawn(); else gameOver(); }
    } else {
      const outro = state === 'clear', climbing = outro && outroT > 3;
      const tx = outro ? 0 : Math.sin(time * 0.45) * 14;
      const ty = outro ? (climbing ? P.y + 30 : 20) : 15 + Math.sin(time * 0.7) * 6;
      P.vx = clamp((tx - P.x) * 1.5, -MAX_V, MAX_V);
      P.vy = clamp((ty - P.y) * 1.5, -MAX_V, MAX_V);
      P.x += P.vx * dt;
      P.y += P.vy * dt;
      P.speed = damp(P.speed, climbing ? 260 : SPEED_BASE, 1.5, dt);
    }
  }
  pending.bomb = false;
  pending.roll = 0;
  P.z -= P.speed * dt;
}

function updateShipVisual() {
  shipRoot.position.set(P.x, P.y, P.z);
  let roll = 0;
  if (P.roll) {
    const k = P.roll.t / ROLL_DUR;
    roll = -P.roll.dir * Math.PI * 2 * (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  }
  ship.g.rotation.set(P.vy / MAX_V * 0.35, -P.vx / MAX_V * 0.22, -P.vx / MAX_V * 0.75 + roll);
  ship.flame.scale.set(1, 1, rand(0.8, 1.2) * (P.speed / SPEED_BASE));
  ship.charge.visible = P.alive && P.charge > 0.25;
  if (ship.charge.visible) {
    const k = Math.min(1, (P.charge - 0.25) / (CHARGE_TIME - 0.25));
    ship.charge.scale.setScalar(0.4 + k * 1.4 + (k >= 1 ? Math.sin(time * 30) * 0.25 : 0));
  }
  const blink = state === 'playing' && P.invuln > 0 && Math.floor(time * 16) % 2 === 1;
  shipRoot.visible = P.alive && state !== 'gameover' && !blink;
  shadow.visible = P.alive && state !== 'gameover' && ground.visible;
  shadow.position.set(P.x, 0.08, P.z);
  shadow.scale.setScalar(1 + P.y * 0.03);
  shadow.material.opacity = clamp(0.45 - P.y * 0.008, 0.08, 0.45);
}

const camPos = new Vector3(0, 18, 25);
function updateCamera(dt) {
  camPos.x = damp(camPos.x, P.x * 0.62, 4, dt);
  camPos.y = damp(camPos.y, P.y * 0.55 + 8, 4, dt);
  camPos.z = P.z + 24 + (P.speed - SPEED_BASE) * 0.05;
  camera.position.copy(camPos);
  if (shake > 0) {
    camera.position.x += rand(-1, 1) * shake * 1.2;
    camera.position.y += rand(-1, 1) * shake * 1.2;
    shake = Math.max(0, shake - dt * 2.2);
  }
  camera.lookAt(P.x * 0.85, P.y * 0.75 + 3, P.z - 45);
  camera.rotateZ(-P.vx / MAX_V * 0.05);
  const fov = 68 + (P.speed - SPEED_BASE) * 0.17;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = damp(camera.fov, fov, 5, dt); camera.updateProjectionMatrix(); }

  sky.position.copy(camera.position);
  backdrop.position.set(0, 0, P.z);
  ground.position.z = P.z - 600;
  groundTex.offset.y = groundEmi.offset.y = -ground.position.z / G_TILE;

  const showRet = state === 'playing' && P.alive;
  retNear.visible = retFar.visible = showRet;
  if (showRet) {
    retNear.position.copy(playerPos).addScaledVector(aim, 28);
    retFar.position.copy(playerPos).addScaledVector(aim, 60);
    retNear.quaternion.copy(camera.quaternion);
    retFar.quaternion.copy(camera.quaternion);
    const col = P.charge >= CHARGE_TIME ? 0xffe066 : assistTarget ? 0xff9a3d : 0x7dff9a;
    retNear.material.color.setHex(col);
    retFar.material.color.setHex(col);
    // a fully charged shot makes the reticles pulse and spin
    const charged = P.charge >= CHARGE_TIME;
    retNear.scale.setScalar(charged ? 1.3 + Math.sin(time * 14) * 0.15 : 1);
    retFar.scale.setScalar(charged ? 1.3 + Math.sin(time * 14 + 1) * 0.15 : 1);
    if (charged) { retNear.rotateZ(time * 4); retFar.rotateZ(-time * 4); }
  }
  lockRet.visible = showRet && !!lockTarget;
  if (lockRet.visible) {
    lockRet.position.copy(lockTarget.pos);
    lockRet.quaternion.copy(camera.quaternion);
    lockRet.rotateZ(time * 3);
    lockRet.scale.setScalar(Math.max(1, lockTarget.radius / 3) * (1 + Math.sin(time * 12) * 0.1));
  }
}

function update(dt) {
  time += dt;
  prevPlayerPos.copy(playerPos);
  updatePlayer(dt);
  playerPos.set(P.x, P.y, P.z);
  if (state === 'playing') { levelT += dt; runScript(); }
  if (state === 'clear') outroT += dt;
  if (boss) updateBoss(dt);
  updateEnemies(dt);
  updatePShots(dt);
  updateEShots(dt);
  updatePickups(dt);
  updateScenery();
  updateEffects(dt);
  updateDust(dt);
  updateComm(dt);
  updateToast(dt);
  updateShipVisual();
  updateCamera(dt);
  updateHUD();
  if (screenTimer > 0) { screenTimer -= dt; if (screenTimer <= 0) showScreen(screenKind); }
}

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  pollGamepad();
  if (!paused) update(dt);
  renderer.render(scene, camera);
}
applyEnv(ENVS.barkeria);
showScreen('title');
frame();
</script>
</body>
