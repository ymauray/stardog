name: Idea or feature request
description: Suggest a new mechanic, enemy, mission or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in the game?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it make better or more fun?
